name: Build personal Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: 0c3f2a4ea2b3527d7cce79494084fc1c2013f7b8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: 0c3f2a4ea2b3527d7cce79494084fc1c2013f7b8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Restore personal signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/zimo.p12"
      - name: Build signed sideload APK
        working-directory: apps/android
        env:
          ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_ALIAS: zimo
        run: |
          export ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_FILE="$RUNNER_TEMP/zimo.p12"
          ./gradlew --no-daemon --max-workers=2 :app:assembleThirdPartyRelease -PopenclawBuildCommit="$SOURCE_SHA" -PopenclawBuildTimestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Verify APK signature and identity
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/thirdParty/release/*.apk dist/OpenClaw-Zimo.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs dist/OpenClaw-Zimo.apk | tee dist/signature.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging dist/OpenClaw-Zimo.apk > dist/package-info.txt
          printf 'Upstream: https://github.com/openclaw/openclaw\nCommit: %s\nBuild: %s/%s/actions/runs/%s\nPersonal build signed by Zi-Mo-2026; not an official OpenClaw release.\n' "$SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/BUILD-INFO.txt
          cd dist
          sha256sum OpenClaw-Zimo.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Zimo-APK
          path: dist/
          retention-days: 30
          if-no-files-found: error
